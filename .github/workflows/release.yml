# Release workflow: one tag push publishes the package from CI, with provenance.
#
# No token is stored anywhere: the job authenticates to the registry through a
# GitHub OIDC exchange ("trusted publishing", bound once with
# `npm trust github dsh-selection-translate --repo 0269chaoup/dsh-selection-translate
# --file release.yml --allow-publish`). That binding is also what lets npm attach
# a provenance attestation, which is why this repository is public: the badge on
# the package page is only verifiable when the source is.
#
# Trigger is a version tag, and the job refuses to publish when the tag and
# package.json disagree — a mismatched release is the one mistake a tag-driven
# pipeline makes expensive to undo.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # Required for the OIDC token npm exchanges for a short-lived publish grant.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs a recent npm; the one bundled with Node is older.
      # No `registry-url` on purpose: it would write an .npmrc pointing at
      # `${NODE_AUTH_TOKEN}`, and trusted publishing has no token to put there —
      # the registry default plus the OIDC exchange is the whole credential.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --global npm@latest

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install --frozen-lockfile

      # The same gates that run locally: types, build, and the offline smoke.
      - run: pnpm run verify

      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          packaged="v$(node -p "require('./package.json').version")"
          echo "tag=${GITHUB_REF_NAME} package=${packaged}"
          test "${GITHUB_REF_NAME}" = "${packaged}"

      # Prints the facts needed to tell "the CLI is too old" apart from "this
      # workflow is not the trusted publisher npm knows about": the OIDC request
      # endpoint only exists when `id-token: write` is honoured, and npm only
      # exchanges a token when the package's trusted publisher matches the
      # repository and this workflow file.
      - name: Diagnose the publish identity
        run: |
          set -euo pipefail
          echo "npm: $(npm --version)"
          echo "node: $(node --version)"
          echo "registry: $(npm config get registry)"
          echo "repo: ${GITHUB_REPOSITORY}"
          echo "ref: ${GITHUB_REF}"
          echo "workflow_ref: ${GITHUB_WORKFLOW_REF}"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "id-token endpoint: present"
          else
            echo "id-token endpoint: MISSING"
          fi
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN: set"
          else
            echo "NODE_AUTH_TOKEN: unset (expected for trusted publishing)"
          fi

      # --provenance ties the tarball to this workflow run and commit.
      - run: npm publish --provenance --access public
